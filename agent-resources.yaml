# The factory's agent environment: what the worker image provisions and the
# launch loads. Versions are exact and the skills revision is an immutable
# commit — an unavailable or invalid entry fails the image build.
schema: msf-agent-resources/v1
pi:
  package: "@earendil-works/pi-coding-agent"
  version: "1.4.0"
  license: MIT
skills:
  repository: https://github.com/mattpocock/skills.git
  revision: "49dd158d1076134a641b33efb035946536778336"
  license: MIT (upstream LICENSE; copied unchanged with the selected skills)
  selected:
    - name: implement
      path: skills/engineering/implement
      role: implement
    - name: tdd
      path: skills/engineering/tdd
      role: tdd
    - name: code-review
      path: skills/engineering/code-review
      role: review
    - name: pr
      path: skills/engineering/pr
      role: pr
    - name: codebase-design
      path: skills/engineering/codebase-design
      role: design
extensions:
  - package: pi-subagents
    version: "0.81.0"
    license: MIT (upstream LICENSE; copied with the package)
    entry: index.js
    guidance:
      name: pi-subagents
      path: skills/pi-subagents
agents:
  - name: code-reviewer
    path: agents/code-reviewer.md
    role: standards
  - name: spec-reviewer
    path: agents/spec-reviewer.md
    role: spec
