credentials:
  copilot-trabalho:
    kind: pi-auth
    ref: copilot-trabalho
  copilot-pessoal:
    kind: pi-auth
    ref: copilot-pessoal
  jira-van:
    kind: env
    ref: JIRA_VAN_TOKEN
  jira-con:
    kind: env
    ref: JIRA_CON_TOKEN
instances:
  - name: trabalho
    maxConcurrent: 1
    pollIntervalSeconds: 300
    maxIterations: 5
    modelAuth: copilot-trabalho
    projects:
      - name: dora-metrics
        enabled: true
        adapter: github
        repository: samuel-santos_bjd/dora-metrics
        targetBranch: main
        prIntegration: github.com
        runtimeProfile: docker-default
        githubAccount: samuel-santos_bjd
        models:
          implementer: github-copilot/gpt-6-luna
          reviewer-standards: github-copilot/claude-haiku-5.5
          reviewer-spec: github-copilot/claude-haiku-5.5
          default: github-copilot/claude-haiku-5.5
      - name: revolving-monolith-backend
        enabled: true
        adapter: jira
        repository: bancojohndeere/revolving-credit-monolith-backend
        targetBranch: develop
        prIntegration: github.com
        runtimeProfile: docker-default
        githubAccount: samuel-santos_bjd
        jira:
          projectKey: VAN
          routingLabel: monolith
          doingTransition: Em andamento
          doneTransition: Itens concluídos
          blockingLinkTypes:
            - Blocks
          credential: jira-van
          operator: 712020:0000-fixture-operator
        models:
          implementer: github-copilot/gpt-6-luna
